StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Fluidity

# The pinned release asset per https://github.com/dnunez24/vale-deslop#install.
# GitHub's own "Source code (zip)" archive link is not installable by `vale
# sync` (directory-name mismatch inside the archive), so this must stay a
# `releases/download/<tag>/Deslop.zip` URL, never the repo/tag archive URL.
Packages = Microsoft, https://github.com/dnunez24/vale-deslop/releases/download/vale-deslop-v1.1.0/Deslop.zip

# Vale has no native MDX parser; treating it as Markdown covers the prose and
# ignores MDX-only syntax (frontmatter, JSX) it wasn't asked to lint.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Microsoft, Deslop
# Informal technical writing assumes the reader knows common computing
# acronyms (CSS, JSX, URL, API); spelling each one out on first use reads as
Microsoft.Acronyms = NO
# Vale.Terms enforces one casing per vocabulary word across the whole file,
# including fenced/inline code (confirmed: it flags the CSS `@import
# "fluidity"` and `npm install fluidity-tailwind` code samples against the
# capitalized product name "Fluidity" used in prose, and vice versa). This
# project's product name is deliberately capitalized in prose and lowercase
# in package/import identifiers, so the check has no correct single answer
# here and produces only false positives.
Vale.Terms = NO
# These nine Deslop rules run with `scope: raw`: they measure rhythm/density
# across a whole document and can't be scoped around non-prose markup via
# `<!-- vale off -->`. Fluidity's docs are dense with code fences, tables, and
# headings, which this family misreads as repetitive/staccato/short-sentence
# prose (see the Deslop README's own documented finding for the same reason).
Deslop.AnaphoraRun = NO
Deslop.BoldFirstBullet = NO
Deslop.ExclamationDensity = NO
Deslop.HedgingDensity = NO
Deslop.ListicleInProse = NO
Deslop.SentenceRhythm = NO
Deslop.StaccatoFragments = NO
Deslop.WhOpener = NO
Deslop.WordEcho = NO

# Generated by scripts/build-docs-reference.mjs from index.css doc comments;
# never hand-authored, so it isn't lint-worthy prose.
[website/docs/05-reference/**]
BasedOnStyles =

# Changeset summaries are short, informal, single-sentence prose written
# through `changeset add`'s interactive prompt; not worth prose-linting.
[.changeset/**]
BasedOnStyles =

# Generated by `changeset version` from changeset summaries; never
# hand-authored, so it isn't lint-worthy prose.
[**/CHANGELOG.md]
BasedOnStyles =

# Vendored skill docs, not this project's own prose; never lint them.
[.agents/**]
BasedOnStyles =

[.claude/**]
BasedOnStyles =
