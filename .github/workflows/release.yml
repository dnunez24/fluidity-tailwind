name: Release

# Versioning and publishing for fluidity-tailwind, driven by Changesets
# (https://changesets.dev/guide/automating). `select-mode` inspects the repo
# on every push and reports one of three modes:
#
#   - "version": unreleased changesets are present -> open/update the
#     "Version Packages" PR that bumps fluidity-tailwind's version and
#     writes its CHANGELOG.md. Never publishes.
#   - "publish": no unreleased changesets, but the local version isn't on
#     the npm registry yet (i.e. the "Version Packages" PR was just merged)
#     -> publish that version.
#   - "none": local version already matches what's on the registry and
#     there are no pending changesets -> the version/publish jobs are
#     skipped entirely. This is the common case (docs-only or non-release
#     commits to main) and is what keeps the job from running when neither
#     the source nor the package version has changed.
#
# The `paths` filter below is a second, cheaper gate: pushes that only touch
# the docs site or unrelated root files never invoke the workflow at all.
#
# Publishing uses npm Trusted Publishing (OIDC) -- no long-lived npm token is
# stored anywhere. This requires the "publish" job's `id-token: write`
# permission (which mints the OIDC token) AND a matching Trusted Publisher
# configured on fluidity-tailwind's npmjs.com package settings: organization
# `dnunez24`, repository `fluidity-tailwind`, workflow filename
# `release.yml`, no environment. That configuration must also explicitly
# allow direct `npm publish` (not just the always-allowed `npm stage
# publish`) -- Changesets only ever calls a single, direct publish and has
# no staged-publish confirm step.

on:
  push:
    branches: [main]
    paths:
      - "fluidity-tailwind/**"
      - ".changeset/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "mise.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch: {}

permissions: {}

# One release flow per ref at a time; never cancel a publish mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise-managed toolchain
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Open Version Packages PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise-managed toolchain
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version packages
        uses: changesets/action/version@v2

  publish:
    name: Publish to npm
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm trusted publishing (OIDC) -- see https://docs.npmjs.com/trusted-publishers
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up mise-managed toolchain
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated files are current
        run: pnpm build:check

      - name: Build fluidity-tailwind
        run: pnpm build

      - name: Publish packages
        uses: changesets/action/publish@v2
