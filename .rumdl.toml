[global]
line-length = 100
# Generated by scripts/build-docs-reference.mjs from doc comments in index.css;
# never hand-edited. Formatting it here would just fight the generator on the
# next `docs:reference` run. .agents/ and .claude/ are vendored skill docs,
# not this project's own prose; never reformat them. .changeset/*.md are
# changeset summaries written by `changeset add`'s interactive prompt and
# CHANGELOG.md files are generated by `changeset version`; neither is
# hand-authored prose worth linting.
exclude = ["website/docs/05-reference", ".agents", ".claude", ".changeset", "**/CHANGELOG.md"]
# Recognizes PascalCase JSX components (<Steps>, <Step>) used throughout
# docs/**/*.mdx as component markup rather than raw inline HTML. README.md
# parses identically under this flavor since it has no JSX.
flavor = "mdx"

[MD013]
code-blocks = false
tables = false
headings = false
paragraphs = false
reflow = true
reflow-mode = "sentence-per-line"

[MD060]
enabled = true
style = "aligned"
max-width = 0

[per-file-ignores]
# docs/**/*.mdx intentionally embed raw lowercase HTML (e.g. `<div
# class="f6y-demo">`) for live utility demos rendered by Blume/Astro; the mdx
# flavor only exempts PascalCase components, not these. README.md has no such
# usage, so MD033 stays enforced there.
"website/docs/**/*.mdx" = ["MD033"]
